<!doctype html>
<html lang="en">
<head>

<style>
:root{--bg:#140C0A;--bg-2:#1C1210;--text:#F6EFE6;--muted:#A39E96;--accent:#E97A5C;--accent-2:#C8553D;--accent-3:#F2B880;--on-accent:#220A04;
--accent-glow:rgba(233,122,92,0.38);--accent-soft:rgba(233,122,92,0.14);--accent-line:rgba(233,122,92,0.3);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.22);--card:rgba(255,255,255,.04);--card-solid:#1C1210;
--display:"Fraunces",Georgia,serif;--body:"DM Sans",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 50% at 50% 0%,rgba(233,122,92,0.17),transparent 70%),radial-gradient(40% 40% at 88% 70%,rgba(233,122,92,0.09),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg-2))}
.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:54px 54px;
mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%)}
nav{display:flex;align-items:center;justify-content:space-between;max-width:1100px;width:100%;margin:0 auto;padding:18px 24px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1.08rem;text-decoration:none}
.brand img{width:30px;height:30px;border-radius:8px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 56px}
.stage{position:relative;isolation:isolate;width:min(340px,86vw)}
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);font-family:var(--display);font-weight:700;font-size:clamp(7rem,30vw,13rem);line-height:1;letter-spacing:-.05em;
background:linear-gradient(180deg,rgba(233,122,92,0.3),transparent 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;z-index:-1;user-select:none}
.art{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 24px 40px rgba(233,122,92,0.38))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:34px}
h1{font-family:var(--display);font-size:clamp(2rem,5.4vw,3.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin-top:14px;max-width:760px}
.hl{background:linear-gradient(120deg,var(--accent),var(--accent-3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p.lead{color:var(--muted);max-width:540px;margin:18px auto 0;font-size:clamp(1rem,2.2vw,1.12rem)}
.path{display:inline-block;margin-top:20px;font-family:var(--mono);font-size:.8rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path b{color:var(--text);font-weight:500}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;border-radius:999px;font-size:1rem;padding:14px 26px;transition:transform .22s,box-shadow .22s,border-color .2s,background .2s}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:680;box-shadow:0 12px 34px -8px var(--accent-glow)}
.btn.primary:hover{transform:translateY(-3px);box-shadow:0 20px 44px -8px var(--accent-glow)}
.btn.ghost{border:1px solid var(--line);background:var(--card);font-weight:550}
.btn.ghost:hover{border-color:var(--line-strong)}
.btn svg{width:18px;height:18px}
footer{text-align:center;padding:0 24px 28px;font-size:.88rem;color:var(--muted)}
footer a{text-decoration:none;margin:0 10px}footer a:hover{color:var(--text)}
.fade{animation:fadeUp .8s ease both}.f1{animation-delay:.08s}.f2{animation-delay:.16s}.f3{animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.rec{transform-box:fill-box;transform-origin:center}
.rec-a{animation:spin 2.4s linear infinite}
.rec-b{animation:spin 2.4s linear infinite,stutter 2.4s steps(1) infinite}
@keyframes stutter{0%,100%{animation-timing-function:linear}48%{transform:rotate(200deg)}52%{transform:rotate(140deg)}}
.note{fill:var(--accent);font-size:22px;animation:drift 3s ease-in-out infinite}.n2{animation-delay:1.4s;fill:var(--accent-3)}
@keyframes drift{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<nav><a class="brand" href="./"><img src="icon.svg" alt="" />Duet</a></nav>
<main>
  <div class="stage fade"><div class="big">404</div>
<svg class="art" viewBox="0 0 320 180" aria-hidden="true">
  <g class="rec rec-a"><circle cx="105" cy="90" r="70" fill="#1b1311" stroke="var(--line)"/>
    <circle cx="105" cy="90" r="56" fill="none" stroke="rgba(255,255,255,.06)"/><circle cx="105" cy="90" r="44" fill="none" stroke="rgba(255,255,255,.06)"/>
    <circle cx="105" cy="90" r="22" fill="var(--accent)"/><circle cx="105" cy="90" r="4" fill="var(--bg)"/>
    <rect x="101" y="70" width="8" height="8" rx="2" fill="var(--bg)" opacity=".5"/></g>
  <g class="rec rec-b"><circle cx="215" cy="90" r="70" fill="#1b1311" stroke="var(--line)"/>
    <circle cx="215" cy="90" r="56" fill="none" stroke="rgba(255,255,255,.06)"/><circle cx="215" cy="90" r="44" fill="none" stroke="rgba(255,255,255,.06)"/>
    <circle cx="215" cy="90" r="22" fill="var(--accent-3)"/><circle cx="215" cy="90" r="4" fill="var(--bg)"/>
    <rect x="211" y="70" width="8" height="8" rx="2" fill="var(--bg)" opacity=".5"/></g>
  <text class="note n1" x="150" y="30">♪</text><text class="note n2" x="170" y="40">♫</text>
</svg></div>
  <p class="eyebrow fade f1">Error 404 · out of sync</p>
  <h1 class="fade f1">This page <span class="hl">skipped a beat.</span></h1>
  <p class="lead fade f2">The page you were after isn't in the queue. It may have moved, or there's a typo in the link. Let's get you back in time.</p>
  <span class="path fade f2" id="path" hidden>Looked for <b></b></span>
  <div class="cta fade f3">
    <a class="btn primary" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Back to Duet</a>
    <a class="btn ghost" href="https://github.com/PremPoddar/Duet/issues">Report a broken link</a>
  </div>
</main>
<footer><a href="privacy/">Privacy</a><a href="https://github.com/PremPoddar/Duet">Source</a><a href="https://prempoddar.is-a.dev/apps/">More apps</a><a href="https://prempoddar.is-a.dev">Website</a><a href="mailto:prempoddar@yandex.com">Contact me</a></footer>
<script>
  // Show which address was missing, without the site's own folder at the front.
  var p = decodeURIComponent(location.pathname).replace(/^\/Duet\/?/i, "/");
  if (p.length > 1) { var e = document.getElementById("path"); e.querySelector("b").textContent = p; e.hidden = false; }
</script>
</body>
</html>
